<html lang="th">
<head>
<meta charset="utf-8">

<title>IT Team — ทีมเทคโนโลยีสารสนเทศ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#111827;--muted:#6b7280;--accent:#4f46e5;--accent2:#06b6d4;--shadow:0 20px 50px rgba(30,41,90,.18);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#151b30;--text:#f1f5f9;--muted:#94a3b8;--accent:#818cf8;--accent2:#22d3ee;--shadow:0 20px 50px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#0b1020;--card:#151b30;--text:#f1f5f9;--muted:#94a3b8;--accent:#818cf8;--accent2:#22d3ee;--shadow:0 20px 50px rgba(0,0,0,.5)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans Thai',system-ui,sans-serif;min-height:100vh;overflow-x:hidden;
background-image:radial-gradient(600px 400px at 15% 0%,color-mix(in srgb,var(--accent) 22%,transparent),transparent),radial-gradient(500px 400px at 90% 100%,color-mix(in srgb,var(--accent2) 20%,transparent),transparent)}
header{text-align:center;padding:48px 20px 8px}
.tag{display:inline-block;font-size:.8rem;letter-spacing:.12em;color:var(--accent);font-weight:600;border:1px solid var(--accent);border-radius:99px;padding:4px 14px}
h1{font-size:clamp(1.8rem,5vw,3rem);margin:14px 0 6px;font-weight:700}
h1 span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{color:var(--muted);margin:0}
.stage{position:relative;height:min(600px,78vh);margin:20px auto 0;max-width:1100px;perspective:1400px;touch-action:pan-y}
.card{position:absolute;top:0;left:50%;width:min(320px,72vw);height:min(500px,64vh);margin-left:calc(min(320px,72vw)/-2);border-radius:24px;overflow:hidden;background:var(--card);box-shadow:var(--shadow);transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .6s,filter .6s;cursor:pointer}
.card img{width:100%;height:100%;object-fit:cover;object-position:center 25%;display:block}
.info{position:absolute;inset:auto 0 0 0;padding:70px 20px 20px;color:#fff;background:linear-gradient(to top,rgba(5,8,25,.92),transparent)}
.info h2{margin:0;font-size:1.3rem}
.info .role{color:#a5f3fc;font-size:.9rem;margin-top:2px}
.info .chips{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.chips i{font-style:normal;font-size:.72rem;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);padding:3px 10px;border-radius:99px}
.nav{display:flex;justify-content:center;align-items:center;gap:18px;margin:8px 0 40px}
.nav button{width:46px;height:46px;border-radius:50%;border:1px solid color-mix(in srgb,var(--text) 20%,transparent);background:var(--card);color:var(--text);font-size:1.2rem;cursor:pointer;box-shadow:var(--shadow);transition:transform .2s}
.nav button:hover{transform:scale(1.1);background:var(--accent);color:#fff}
.dots{display:flex;gap:8px}
.dots b{width:9px;height:9px;border-radius:99px;background:color-mix(in srgb,var(--text) 25%,transparent);cursor:pointer;transition:all .3s}
.dots b.on{width:28px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>

];
const stage=document.getElementById('stage'),dots=document.getElementById('dots');
let cur=2,timer;
team.forEach((p,k)=>{
 const c=document.createElement('div');c.className='card';
 c.innerHTML=`<img src="data:image/jpeg;base64,${p.i}" alt="${p.n}"><div class="info"><h2>${p.n}</h2><div class="role">${p.r}</div><div class="chips">${p.t.map(x=>`<i>${x}</i>`).join('')}</div></div>`;
 c.onclick=()=>go(k);stage.appendChild(c);
 const d=document.createElement('b');d.onclick=()=>go(k);dots.appendChild(d);
});
function render(){
 const N=team.length;
 [...stage.children].forEach((c,k)=>{
  let o=k-cur;if(o>N/2)o-=N;if(o<-N/2)o+=N;
  const a=Math.abs(o);
  c.style.transform=`translateX(${o*62}%) translateZ(${-a*140}px) rotateY(${-o*22}deg) scale(${1-a*.06})`;
  c.style.opacity=a>2?0:1-a*.28;
  c.style.filter=a?`brightness(${1-a*.2}) blur(${a*.6}px)`:'none';
  c.style.zIndex=10-a;c.style.pointerEvents=a>2?'none':'auto';
 });
 [...dots.children].forEach((d,k)=>d.classList.toggle('on',k===cur));
}
function go(k){cur=(k+team.length)%team.length;render();auto()}
function auto(){clearInterval(timer);timer=setInterval(()=>go(cur+1),4500)}
prev.onclick=()=>go(cur-1);next.onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(cur-1);if(e.key==='ArrowRight')go(cur+1)});
let sx=null;
stage.addEventListener('pointerdown',e=>sx=e.clientX);
stage.addEventListener('pointerup',e=>{if(sx!==null&&Math.abs(e.clientX-sx)>50)go(cur+(e.clientX<sx?1:-1));sx=null});
render();auto();
</script>
